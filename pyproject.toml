[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm[toml]>=6.2", "numpy"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. "gat" is taken on PyPI (GenomicAssociationTester),
# so the distribution publishes as nlr-gat; the import package and the
# CLI entry point remain `gat`.
name = "nlr-gat"
description = "Grid Analysis Toolkit - A module for PCM/CEM data analysis."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.1.0",
    "h5py",
    "tables",
    "matplotlib",
    "pydantic",
    "click>=8.1.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "geopandas>=1.1.1",
    "duckdb>=1.4.0",
    "polars>=1.0",
    "orjson>=3.9.0",
    "pyarrow>=14.0",
    "PySide6; sys_platform == 'darwin'",
]
license = {file = "LICENSE"}
authors = [
   {name = "Micah Webb", email = "micah.webb@nlr.gov"},
]
classifiers = [
   "Programming Language :: Python :: 3",
   "License :: OSI Approved :: BSD License",
   "Operating System :: OS Independent",
]
[project.scripts]
gat="gat.cli:cli"

[project.urls]
"Homepage" = "https://github.com/NatLabRockies/GridAnalysisToolkit"
"Bug Tracker" = "https://github.com/NatLabRockies/GridAnalysisToolkit/issues"
"Documentation" = "https://natlabrockies.github.io/GridAnalysisToolkit/"


[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "gat",
    "gat.backends",
    "gat.config",
    "gat.project_management",
    "gat.quickplots",
    "gat.scenariohandlers",
    "gat.datahelpers",
    "gat.datahelpers.geo",
    "gat.models",
    "gat.reports",
    "gat.registry",
    "gat.simulations",
    "gat.systems",
    "gat.server",
    "gat.client",
    ]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml"]

[tool.setuptools_scm]
write_to = "src/gat/_version.py"
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = ["C0111", "C0301"]

[project.optional-dependencies]
dev = [
   "pytest>=6.0",
   "pytest-cov",
   "pytest-regressions>=2.5",
   "black>=22.3.0",
   "isort>=5.0.0",
   "mypy>=0.910",
   "pylint>=2.5.0",
]
doc = [
    "sphinx",
    "myst-parser",
    "autodoc-pydantic>=2.2.0",
    "ghp-import>=2.1.0",
    "myst-parser>=4.0.0",
    "sphinx-book-theme>=1.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinx-gallery",
    "sphinx-click"
]
interactive = [
    "plotly>=5.0.0",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]
client = [
    "httpx>=0.24",
]
reports = [
    "python-pptx>=1.0.2",
]
plexos-duckdb = [
    "plexos2duckdb>=0.1.0b11,<0.2.0",
]
