<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top mast + earth-wire peak -->
  <line x1="12" y1="1.5" x2="12" y2="4"/>
  <line x1="10.5" y1="4" x2="13.5" y2="4"/>
  <!-- Upper main crossarm + insulators -->
  <line x1="5" y1="7" x2="19" y2="7"/>
  <line x1="5" y1="7" x2="5" y2="8"/>
  <line x1="12" y1="7" x2="12" y2="8"/>
  <line x1="19" y1="7" x2="19" y2="8"/>
  <!-- Lower crossarm + insulators -->
  <line x1="6" y1="10" x2="18" y2="10"/>
  <line x1="6" y1="10" x2="6" y2="11"/>
  <line x1="12" y1="10" x2="12" y2="11"/>
  <line x1="18" y1="10" x2="18" y2="11"/>
  <!-- Trapezoid sides (open base) -->
  <line x1="10" y1="4" x2="8" y2="22"/>
  <line x1="14" y1="4" x2="16" y2="22"/>
  <!-- Top horizontal -->
  <line x1="10" y1="4" x2="14" y2="4"/>
  <!-- X brace spanning top 70% -->
  <line x1="10" y1="4" x2="15.4" y2="16.6"/>
  <line x1="14" y1="4" x2="8.6" y2="16.6"/>
  <!-- Horizontal bar at bottom of X -->
  <line x1="8.6" y1="16.6" x2="15.4" y2="16.6"/>
</svg>
